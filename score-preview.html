<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>帖子内嵌乐谱预览 · 组件预览页</title>
<style>
  /* 模拟帖子详情页的乐谱区：v3.css 的米色纸外壳 + PostView 里把它剥掉的覆盖规则，
     好让这里看到的就是帖子页的实际观感。 */
  body { margin: 0; padding: 24px 32px 60px; background: var(--surface, #F9F7F5); font-family: var(--sans); }
  .wrap { max-width: 820px; margin: 0 auto; }
  .picker { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .pk {
    font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    background: var(--card, #fff); border: 1px solid var(--hairline, #EDE7DE); color: var(--wood, #5D4432);
  }
  .pk:hover { border-color: #D8CCBB; }
  .pk.on { background: var(--wood, #5D4432); border-color: var(--wood, #5D4432); color: #F7F2E8; }
  body .score-paper { background: transparent; border: 0; border-radius: 0; padding: 0; box-shadow: none; }
  body .score-paper .p-sub { margin-bottom: 12px; }
</style>
</head>
<body>
<!--
  ScorePreview 组件预览页 —— **只在 dev 下有效**
  ---------------------------------------------------------------------------
  用途：不起后端也能直接看「帖子内嵌乐谱预览」这个组件长什么样、能不能点播放。
  访问：http://127.0.0.1:5174/score-preview.html
  ⚠️ 它 import 的是 /src/ 下的源码模块，只有 vite dev 能编译它；
      `vite build` 只以 index.html 为入口，本文件**不进构建产物**。
  正式位置：帖子详情页的乐谱区 —— 见 src/views/PostView.vue + components/ScorePreview.vue
  下面的四份谱与 src/api/mock.js 里四条带谱帖**逐字相同**（内核简谱原文）。
-->
<div id="app"></div>

<script type="module">
import '/src/styles/v3.css'
import { createApp, h, ref } from 'vue'
import ScorePreview from '/src/components/ScorePreview.vue'

const head = (title, tempo, tuning) => [
  'title: ' + title,
  'key: 1=C',
  'meter: 4/4',
  'tempo: ' + tempo,
  'tuning: ' + tuning,
  'mode: movable',
  'direction: up',
  ''
].join('\n')

const body = (m) => '\n' + 'M: ' + m + '\n'

const SAMPLES = [
  {
    name: '9001 小星星 · 17键',
    title: '小星星', sub: '17键 · C调 · 90 BPM · 拇指琴谱',
    src: head('小星星', 90, 17) + body('1 1 5 5 | 6 6 5- | 4 4 3 3 | 2 2 1- | 5 5 4 4 | 3 3 2- | 5 5 4 4 | 3 3 2- |')
  },
  {
    name: '9002 虫儿飞 · 17键',
    title: '虫儿飞', sub: '17键 · C调 · 72 BPM · 拇指琴谱',
    src: head('虫儿飞', 72, 17) + body('1 3 5 5 | 3 2 1- | 6 1 3 3 | 1 2-- | 1 3 5 5 | 3 2 1- | 2 3 2 1 | 6-- |')
  },
  {
    name: '9003 晴天前奏 · 21键',
    title: '晴天前奏', sub: '21键 · C调 · 80 BPM · 拇指琴谱',
    src: head('晴天前奏', 80, 21) + body('3 5 6 5 | 3 2 1 2 | 3 5 3 2 | 1 6 5 6 | 1 2 0 0 |')
  },
  {
    name: '9005 欢乐颂 · 17键',
    title: '欢乐颂', sub: '17键 · C调 · 100 BPM · 拇指琴谱',
    src: head('欢乐颂', 100, 17) + body('3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 3 2 2- | 3 3 4 5 | 5 4 3 2 | 1 1 2 3 | 2 1 1- |')
  }
]

const cur = ref(0)

createApp({
  setup() {
    return () => {
      const s = SAMPLES[cur.value]
      return h('div', { class: 'wrap' }, [
        h('div', { class: 'picker' }, SAMPLES.map((x, i) =>
          h('button', {
            class: ['pk', i === cur.value ? 'on' : ''],
            type: 'button',
            onClick: () => { cur.value = i }
          }, x.name)
        )),
        h('div', { class: 'score-paper' }, [
          h('div', { class: 'p-title' }, '《' + s.title + '》'),
          h('div', { class: 'p-sub' }, s.sub),
          /* 切换谱例时 ScorePreview 内部的 watch(props.source) 会重新灌数据、重算卡片宽 */
          h(ScorePreview, { source: s.src })
        ])
      ])
    }
  }
}).mount('#app')
</script>
</body>
</html>
